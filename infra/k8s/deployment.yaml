apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradegrid-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradegrid-gateway
  template:
    metadata:
      labels:
        app: tradegrid-gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          ports:
            - containerPort: 8081


